services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewflow-postgres
    environment:
      POSTGRES_USER: interviewflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewflow -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - interviewflow

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.2
    container_name: interviewflow-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - interviewflow

  init-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.2
    container_name: interviewflow-init-topics
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >
        rpk topic create application-events reminder-events
        --brokers redpanda:9092
        --if-not-exists
    networks:
      - interviewflow
    restart: "no"

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: interviewflow-auth
    environment:
      PORT: 10000
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/interviewflow_auth
      AUTH_DB_USERNAME: interviewflow
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION_MILLIS: 86400000
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS}
      JAVA_OPTS: "-Xms64m -Xmx192m"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interviewflow

  application-service:
    build:
      context: ./backend/application-service
      dockerfile: Dockerfile
    container_name: interviewflow-application
    environment:
      PORT: 10000
      APPLICATION_DB_URL: jdbc:postgresql://postgres:5432/interviewflow_application
      APPLICATION_DB_USERNAME: interviewflow
      APPLICATION_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_HOST: redpanda
      KAFKA_PORT: 9092
      APPLICATION_EVENTS_TOPIC: application-events
      REMINDER_EVENTS_TOPIC: reminder-events
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS}
      JAVA_OPTS: "-Xms64m -Xmx192m"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
    networks:
      - interviewflow

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: interviewflow-notification
    environment:
      PORT: 10000
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/interviewflow_notification
      NOTIFICATION_DB_USERNAME: interviewflow
      NOTIFICATION_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_HOST: redpanda
      KAFKA_PORT: 9092
      APPLICATION_EVENTS_TOPIC: application-events
      REMINDER_EVENTS_TOPIC: reminder-events
      NOTIFICATION_CONSUMER_GROUP: notification-service
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS}
      JAVA_OPTS: "-Xms64m -Xmx192m"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
    networks:
      - interviewflow

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: interviewflow-gateway
    environment:
      PORT: 8080
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 10000
      APPLICATION_SERVICE_HOST: application-service
      APPLICATION_SERVICE_PORT: 10000
      NOTIFICATION_SERVICE_HOST: notification-service
      NOTIFICATION_SERVICE_PORT: 10000
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS}
      JAVA_OPTS: "-Xms64m -Xmx128m"
    depends_on:
      auth-service:
        condition: service_started
      application-service:
        condition: service_started
      notification-service:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - interviewflow

networks:
  interviewflow:
    driver: bridge

volumes:
  postgres_data:
